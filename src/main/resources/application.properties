# Application Properties
# Loaded at runtime — can be overridden by environment-specific files

# Application Info
app.name=Customer Review Moderation Portal
app.version=1.0.0
app.env=development

# Logging
logging.level=INFO
logging.file=logs/crmp.log

# H2 Database (development)
# Switch to MySQL/PostgreSQL for production
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:crmpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

# Hibernate
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
hibernate.format_sql=false

# Tomcat context path (set via Maven/Jenkins)
app.context.path=/crmp
